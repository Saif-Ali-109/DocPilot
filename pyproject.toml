[project]
name = "docpilot"
version = "0.1.0"
description = "Evidence-driven agentic RAG for technical documentation"
readme = "README.md"
authors = [
    { name = "Saif-Ali-109", email = "01-134242-109@student.bahria.edu.pk" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Phase 7 (S1-T3): DocPilot consumes the extracted ragkit core chain
    # (dogfood) — no copied modules in src/docpilot/. Pinned to the exact
    # ragkit commit; updated to the `v0.1.0` tag at Stage-1 close
    # (PLAN §8.5 version pairing). S1-T8: pinned to tag `v0.1.0`
    # (ragkit @ Stage-1 complete). S2-T3: pinned to S2-T2 commit `3ded3fb`
    # (ragkit agentic layer + tools moved; DocPilot deletes its copies and
    # imports ragkit.agent.* / ragkit.tools.* — retagged `v0.2.0` at S2-T5).
    "ragkit @ git+https://github.com/Saif-Ali-109/ragkit.git@3ded3fb",
    "torch==2.14.0+cpu",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "gitpython>=3.1.0",
    "langgraph>=1.2.11",
    # Phase 5 — API + UI (SPEC §7): async FastAPI backend, SSE streaming,
    # SQLite session/chat history, Chainlit UI (built on FastAPI/Starlette).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "chainlit>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
docpilot = "docpilot:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# --- CPU-only torch (no CUDA toolkit) ---
# BGE-small inference runs on CPU; forcing the PyTorch CPU index avoids
# pulling ~2.5GB of nvidia-* CUDA packages into the venv.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
